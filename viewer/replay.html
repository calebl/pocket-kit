<!DOCTYPE html>
<!-- Plays a pocket-kit session replay file from this computer, with no server:
     open this page in a browser straight from a pocket-kit checkout or the
     installed gem, then pick the file a report names under "replay". It loads
     only the vendored files next to it. -->
<html>
  <head>
    <meta charset="utf-8">
    <title>Session replay</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../app/assets/stylesheets/pocket_kit/vendor/rrweb-player-2.1.7.css">
    <link rel="stylesheet" href="../app/assets/stylesheets/pocket_kit/replay.css">
    <script src="../app/assets/javascripts/pocket_kit/vendor/rrweb-player-2.1.7.min.js"></script>
    <script src="../app/assets/javascripts/pocket_kit/replay_viewer.js"></script>
  </head>
  <body class="pk-replay">
    <main data-pk-replay-viewer>
      <h1>Session replay</h1>
      <label>Open a replay file: <input type="file" accept=".json,application/json" data-pk-replay-file></label>
      <p data-pk-replay-status role="status"></p>
      <div data-pk-replay-stage></div>
    </main>
  </body>
</html>
